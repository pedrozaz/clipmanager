name: "Release Build"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chave privada para assinar os pacotes do auto-updater.
          # Gere com: tauri signer generate -w ~/.tauri/myapp.key
          # Adicione ao repositório: Settings > Secrets > TAURI_SIGNING_PRIVATE_KEY
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Assuna - Clip Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Assuna - Clip Manager ${{ github.ref_name }}

            ### Instalação
            - **Windows:** Baixe o arquivo `.exe` abaixo e execute o instalador.
            - **Linux (Debian/Ubuntu):** Baixe o arquivo `.deb` e instale com `sudo dpkg -i *.deb`.
            - **Linux (outras distros):** Use o arquivo `.AppImage` — dê permissão de execução e abra diretamente.

            > Usuários que já possuem o app instalado podem atualizar clicando em **Verificar Atualização** dentro de Configurações.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
